; ============================================================
;  AVATTO GW90-TI 产测固件 PlatformIO 环境配置
; ============================================================
;
;  使用方法:
;    1. 将此文件内容追加到项目根目录的 platformio.ini 末尾
;    2. 将 factory_test/factory_test_main.cpp 复制到 src/ 目录
;       (编译前备份原 main.cpp, 或使用 src_filter 切换)
;    3. 执行: pio run -e factory-test-solo
;
;  或者使用下面的 src_dir 方案 (推荐):
;    直接编译, 源码在 factory_test/ 目录下
;
; ============================================================

; --- 方案一: 独立源码目录 (推荐) ---
; 在 platformio.ini 中添加以下环境

[env:factory-test-solo]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-solo1
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@6.21.3
build_flags = 
	-DBUILD_ENV_NAME=$PIOENV
	-DFRAMEWORK_ARDUINO_SOLO1
	-DFACTORY_TEST
board_build.f_cpu = 160000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
; 手动指定源码文件 — 只编译产测固件
build_src_filter = 
	-<*>
	+<../factory_test/factory_test_main.cpp>
lib_extra_dirs = lib
